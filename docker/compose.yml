      - supergrid.flower.ai:9092
      - --auth-supernode-private-key
      - /keys/hospital_3
      - --node-config
      - site-name="hospital_3" records-path="/data/hospital_3.jsonl" partition-id=2 num-partitions=5
      - --isolation
