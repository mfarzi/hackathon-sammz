<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#005eb8"/><rect x="0" y="1068" width="1920" height="12" rx="0" fill="#003087"/><rect x="160" y="300" width="148" height="70" rx="4" fill="#ffffff"/><text x="234" y="352" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="48" fill="#005eb8" font-weight="700" letter-spacing="1.5" text-anchor="middle">NHS</text><text x="160" y="520" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="104" fill="#ffffff" font-weight="700">Rare Disease</text><text x="160" y="630" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="104" fill="#ffffff" font-weight="700">Consult Network</text><text x="160" y="720" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="40" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><text x="160" y="900" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#cfe3f4" font-weight="400">A clinician describes a patient nobody can place. Every hospital checks its own</text><text x="160" y="936" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#cfe3f4" font-weight="400">records, reasons over its own notes, and answers — without a record leaving the building.</text><text x="160" y="1010" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#7fb0da" font-weight="400">Track 1 · Flower Agent Harness   ·   Collaborative Agent Hackathon, Cambridge   ·   26 August 2026</text></svg>