<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 1</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 2</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 3</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 4</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="44.0" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="258" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">THE CASE, AS THE CLINICIAN TYPED IT</text><rect x="64" y="292" width="1792" height="212" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="292" width="6" height="212" rx="0" fill="#005eb8"/><text x="112" y="372" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="34" fill="#212b32" font-weight="400">Man in his 40s, six weeks of nosebleeds and persistent nasal crusting,</text><text x="112" y="420" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="34" fill="#212b32" font-weight="400">now coughing blood. Urine dip shows blood. Sinus pain throughout.</text><text x="112" y="468" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="34" fill="#212b32" font-weight="400">Two courses of antibiotics, no response.</text><text x="64" y="640" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="68" fill="#212b32" font-weight="700">6 weeks</text><text x="64" y="674" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" fill="#768692" font-weight="700" letter-spacing="1.3">OF SYMPTOMS</text><text x="560" y="640" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="68" fill="#212b32" font-weight="700">2 courses</text><text x="560" y="674" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" fill="#768692" font-weight="700" letter-spacing="1.3">OF ANTIBIOTICS, NO RESPONSE</text><text x="1160" y="640" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="68" fill="#d5281b" font-weight="700">0</text><text x="1160" y="674" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" fill="#768692" font-weight="700" letter-spacing="1.3">DIAGNOSES REACHED</text><text x="64" y="810" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="54" fill="#212b32" font-weight="700">His hospital has never seen this combination.</text><text x="64" y="880" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">One or two comparable cases in living memory, and no way to reach the ones sitting</text><text x="64" y="918" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">in a hospital two hundred miles away. The data that would settle it is patient records.</text></svg>