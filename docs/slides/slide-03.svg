y='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" fill="#768692" font-weight="700" letter-spacing="1.3">HOSPITALS HOLD ONE OR MORE</text><text x="1300" y="748" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="68" fill="#d5281b" font-weight="700">3</text><text x="1300" y="782" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="18" fill="#768692" font-weight="700" letter-spacing="1.3">THE MOST ANY SINGLE SITE HOLDS</text><text x="64" y="906" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="50" fill="#212b32" font-weight="700">No one of them holds enough to make the call.</text><text x="64" y="968" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">The answer already exists. It is distributed across institutions that cannot share records.</text></svg>