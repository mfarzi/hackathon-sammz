ly='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 4</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="342.6666666666667" height="4" rx="0" fill="#007f3b"/><rect x="342.6666666666667" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="258" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">THE NETWORK</text><text x="64" y="328" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="62" fill="#212b32" font-weight="700">Five hospitals. Seventy-five thousand records.</text><rect x="64" y="400" width="340" height="176" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="400" width="6" height="176" rx="0" fill="#007f3b"/><text x="90" y="448" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="25" fill="#212b32" font-weight="700">Royal Infirmary</text><text x="90" y="480" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">Urban teaching</text><text x="90" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="38" fill="#212b32" font-weight="700">26,149</text><text x="222" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">records</text><rect x="426" y="400" width="340" height="176" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="426" y="400" width="6" height="176" rx="0" fill="#007f3b"/><text x="452" y="448" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="25" fill="#212b32" font-weight="700">Riverbend Rural</text><text x="452" y="480" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">District general</text><text x="452" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="38" fill="#212b32" font-weight="700">5,203</text><text x="562" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">records</text><rect x="788" y="400" width="340" height="176" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="788" y="400" width="6" height="176" rx="0" fill="#007f3b"/><text x="814" y="448" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="25" fill="#212b32" font-weight="700">Cardiac Institute</text><text x="814" y="480" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">Specialist centre</text><text x="814" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="38" fill="#212b32" font-weight="700">10,057</text><text x="946" y="540" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="20" fill="#768692" font-weight="400">records</text><rect x="1150" y="400" width="340" height="176" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x