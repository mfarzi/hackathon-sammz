<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 1  ✓</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 2</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 3</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 4</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="342.6666666666667" height="4" rx="0" fill="#007f3b"/><rect x="342.6666666666667" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="258" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">STAGE 2 · WHAT ACTUALLY CROSSES THE BOUNDARY</text><text x="64" y="328" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="62" fill="#212b32" font-weight="700">The query travels. The records don't.</text><rect x="64" y="400" width="880" height="460" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="400" width="6" height="460" rx="0" fill="#005eb8"/><rect x="112" y="438" width="276" height="32" rx="16" fill="#e8f1fa" stroke="#005eb8" stroke-width="1.2"/><text x="129" y="460" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.1">SENT TO EVERY HOSPITAL</text><text x="112" y="528" font-family='"SF Mono", Menlo, monospace' font-size="22" fill="#4c6272" font-weight="700">symptoms</text><text x="112" y="570" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">· epistaxis</text><text x="112" y="610" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">· nasal_crusting</text><text x="112" y="650" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">· haemoptysis</text><text x="112" y="690" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">· haematuria</text><text x="112" y="730" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">· sinus_pain</text><text x="560" y="528" font-family='"SF Mono", Menlo, monospace' font-size="22" fill="#4c6272" font-weight="700">age_bracket</text><text x="560" y="570" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">41-50</text><text x="560" y="640" font-family='"SF Mono", Menlo, monospace' font-size="22" fill="#4c6272" font-weight="700">gender</text><text x="560" y="682" font-family='"SF Mono", Menlo, monospace' font-size="26" fill="#212b32" font-weight="400">M</text><rect x="976" y="400" width="880" height="460" rx="4" fill="#fdf2f1" stroke="#d8dde0" stroke-width="1.2"/><rect x="976" y="400" width="6" height="460" rx="0" fill="#d5281b"/><rect x="1024" y="438" width="309" height="32" rx="16" fill="#ffffff" stroke="#d5281b" stroke-width="1.2"/><text x="1041" y="460" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#d5281b" font-weight="700" letter-spacing="1.1">NEVER LEAVES THE HOSPITAL</text><text x="1024" y="552" font-family='"SF Mono", Menlo, monospace' font-size="30" fill="#212b32" font-weight="400">· record_id</text><text x="1024" y="604" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="400">· the free-text clinical note</text><text x="1024" y="656" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="400">· anything identifying</text><text x="1024" y="748" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">Read where they live, then dropped. An allowlist</text><text x="1024" y="782" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">decides what may cross, so a field added to the</text><text x="1024" y="816" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">record format later cannot leak by being forgotten.</text><text x="64" y="950" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="40" fill="#212b32" font-weight="700">Sites return a judgement their own agent wrote — not a record it copied.</text></svg>