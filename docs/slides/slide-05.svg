<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 1  ✓</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 2  ✓</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 3</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 4</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="641.3333333333334" height="4" rx="0" fill="#007f3b"/><rect x="641.3333333333334" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="250" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">STAGE 3 · EACH SITE READS ITS OWN NOTES, LOCALLY</text><text x="64" y="316" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="54" fill="#212b32" font-weight="700">Five answers. One of them is “nothing”.</text><rect x="64" y="372" width="1792" height="116" rx="4" fill="#fffcf2" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="372" width="6" height="116" rx="0" fill="#8a6100"/><text x="112" y="416" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Cardiac Institute</text><rect x="112" y="438" width="111" height="32" rx="16" fill="#ffffff" stroke="#8a6100" stroke-width="1.2"/><text x="129" y="460" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#8a6100" font-weight="700" letter-spacing="1.1">NO DATA</text><text x="400" y="416" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">“Nothing combines upper airway disease with renal findings. Our corpus is cardiac — treat this</text><text x="400" y="448" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">as a genuine absence, not a gap in coverage.”</text><rect x="64" y="504" width="1792" height="116" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="504" width="6" height="116" rx="0" fill="#007f3b"/><text x="112" y="548" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Riverbend Rural</text><rect x="112" y="570" width="100" height="32" rx="16" fill="#f5fbf7" stroke="#007f3b" stroke-width="1.2"/><text x="129" y="592" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#007f3b" font-weight="700" letter-spacing="1.1">1 CASE</text><text x="400" y="548" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">“Treated twice as sinusitis with no response, then frank haematuria. Referred out before a</text><text x="400" y="580" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">diagnosis was reached here, so our record ends unresolved.”</text><rect x="64" y="636" width="1792" height="116" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="636" width="6" height="116" rx="0" fill="#007f3b"/><text x="112" y="680" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Children's Hospital</text><rect x="112" y="702" width="100" height="32" rx="16" fill="#f5fbf7" stroke="#007f3b" stroke-width="1.2"/><text x="129" y="724" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#007f3b" font-weight="700" letter-spacing="1.1">1 CASE</text><text x="400" y="680" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">“Saddle-nose deformity, microscopic haematuria on screening. Confirmed on biopsy. Argues against</text><text x="400" y="712" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">the alternatives: no anti-GBM antibodies.”</text><rect x="64" y="768" width="1792" height="116" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="768" width="6" height="116" rx="0" fill="#007f3b"/><text x="112" y="812" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Royal Infirmary</text><rect x="112" y="834" width="111" height="32" rx="16" fill="#f5fbf7" stroke="#007f3b" stroke-width="1.2"/><text x="129" y="856" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#007f3b" font-weight="700" letter-spacing="1.1">2 CASES</text><text x="400" y="812" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">“Upper airway disease preceded renal involvement by weeks in both. Both treated as infection</text><text x="400" y="844" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">first. Neither improved on antibiotics.”</text><rect x="64" y="900" width="1792" height="116" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="900" width="6" height="116" rx="0" fill="#007f3b"/><text x="112" y="944" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Regional Hospital</text><rect x="112" y="966" width="111" height="32" rx="16" fill="#f5fbf7" stroke="#007f3b" stroke-width="1.2"/><text x="129" y="988" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#007f3b" font-weight="700" letter-spacing="1.1">3 CASES</text><text x="400" y="944" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">“Two confirmed vasculitis; one turned out to be TB with incidental renal stones. We would not</text><text x="400" y="976" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">exclude TB on this presentation alone.”</text></svg>