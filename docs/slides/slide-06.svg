<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 1  ✓</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 2  ✓</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 3  ✓</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 4</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="940.0" height="4" rx="0" fill="#007f3b"/><rect x="940.0" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="258" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">STAGE 4 · THE HUB ASKS A QUESTION BACK</text><text x="64" y="328" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="62" fill="#212b32" font-weight="700">This is where it stops being a search.</text><rect x="64" y="400" width="1792" height="156" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="400" width="6" height="156" rx="0" fill="#aeb7bd"/><text x="112" y="452" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">“Three sites describe upper airway disease before renal involvement. That fits several</text><text x="112" y="490" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">vasculitides equally well, so it does not discriminate. What separates them is whether the</text><text x="112" y="528" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">renal picture is a true glomerulonephritis, and how fast it moved.”</text><rect x="64" y="566" width="1792" height="148" rx="4" fill="#005eb8"/><text x="112" y="630" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="34" fill="#ffffff" font-weight="700">“Did the renal involvement show an active urinary sediment, and how many</text><text x="112" y="678" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="34" fill="#ffffff" font-weight="700">weeks from first nasal symptom to renal finding?”</text><rect x="64" y="776" width="1792" height="50" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="776" width="6" height="50" rx="0" fill="#007f3b"/><text x="112" y="809" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#212b32" font-weight="700">Royal Infirmary</text><text x="480" y="809" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Active sediment in both. 5 and 7 weeks.</text><rect x="64" y="838" width="1792" height="50" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="838" width="6" height="50" rx="0" fill="#007f3b"/><text x="112" y="871" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#212b32" font-weight="700">Children's Hospital</text><text x="480" y="871" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Active sediment. Roughly 9 weeks.</text><rect x="64" y="900" width="1792" height="50" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="900" width="6" height="50" rx="0" fill="#007f3b"/><text x="112" y="933" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#212b32" font-weight="700">Regional Hospital</text><text x="480" y="933" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Active sediment in the two confirmed cases; the TB mimic had a bland sediment.</text><text x="64" y="1010" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="28" fill="#007f3b" font-weight="700">The mimic was excluded on the answer to a question no one had thought to ask at the start.</text></svg>