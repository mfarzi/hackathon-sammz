<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 1  ✓</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 2  ✓</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 3  ✓</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 4  ✓</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 5</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#aeb7bd" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#aeb7bd" font-weight="400">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="1238.6666666666667" height="4" rx="0" fill="#007f3b"/><rect x="1238.6666666666667" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="250" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">STAGE 5 · FIVE BLIND REVIEWERS, THEN THREE REFUTERS EACH</text><text x="64" y="316" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="56" fill="#212b32" font-weight="700">The panel attacks its own answer.</text><rect x="64" y="372" width="1792" height="142" rx="4" fill="#f5fbf7" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="372" width="6" height="142" rx="0" fill="#007f3b"/><text x="112" y="420" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="700">Granulomatosis with polyangiitis</text><text x="112" y="464" font-family='"SF Mono", Menlo, monospace' font-size="34" fill="#007f3b" font-weight="700">0.87</text><rect x="240" y="438" width="122" height="32" rx="16" fill="#ffffff" stroke="#007f3b" stroke-width="1.2"/><text x="257" y="460" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#007f3b" font-weight="700" letter-spacing="1.1">SURVIVED</text><text x="700" y="416" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Held against all three refuters. Upper airway disease preceding active</text><text x="700" y="447" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">glomerulonephritis over weeks, unresponsive to antibiotics — matches 6 of 7 network</text><text x="700" y="478" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">cases.</text><rect x="64" y="530" width="1792" height="142" rx="4" fill="#fffcf2" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="530" width="6" height="142" rx="0" fill="#8a6100"/><text x="112" y="578" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="700">Microscopic polyangiitis</text><text x="112" y="622" font-family='"SF Mono", Menlo, monospace' font-size="34" fill="#8a6100" font-weight="700">0.71</text><rect x="240" y="596" width="144" height="32" rx="16" fill="#ffffff" stroke="#8a6100" stroke-width="1.2"/><text x="257" y="618" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#8a6100" font-weight="700" letter-spacing="1.1">UNVERIFIED</text><text x="700" y="574" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Only two reviewers returned a verdict before the round closed. Not read as</text><text x="700" y="605" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">agreement.</text><rect x="64" y="688" width="1792" height="142" rx="4" fill="#fdf2f1" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="688" width="6" height="142" rx="0" fill="#d5281b"/><text x="112" y="736" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="700">Anti-GBM disease</text><text x="112" y="780" font-family='"SF Mono", Menlo, monospace' font-size="34" fill="#d5281b" font-weight="700">0.68</text><rect x="240" y="754" width="144" height="32" rx="16" fill="#ffffff" stroke="#d5281b" stroke-width="1.2"/><text x="257" y="776" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#d5281b" font-weight="700" letter-spacing="1.1">KILLED 3–0</text><text x="700" y="732" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">The Children's Hospital case tested negative for anti-GBM antibodies, and sinonasal</text><text x="700" y="763" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">disease preceding renal involvement by weeks does not fit the usual course.</text><rect x="64" y="846" width="1792" height="142" rx="4" fill="#fdf2f1" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="846" width="6" height="142" rx="0" fill="#d5281b"/><text x="112" y="894" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#212b32" font-weight="700">Seasonal vasculitic nephropathy</text><text x="112" y="938" font-family='"SF Mono", Menlo, monospace' font-size="34" fill="#d5281b" font-weight="700">0.66</text><rect x="240" y="912" width="320" height="32" rx="16" fill="#ffffff" stroke="#d5281b" stroke-width="1.2"/><text x="257" y="934" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#d5281b" font-weight="700" letter-spacing="1.1">PLANTED PROBE · KILLED 3–0</text><text x="700" y="890" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">Not a real entity. Inserted indistinguishably to test whether the panel can still</text><text x="700" y="921" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="23" fill="#4c6272" font-weight="400">say no. Rejected for having no case series behind it at any site.</text><text x="64" y="1032" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">A panel that never rejects anything is a rubber stamp. The planted probe proves rejection is live on this run.</text></svg>