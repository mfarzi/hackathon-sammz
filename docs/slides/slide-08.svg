<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f0f4f5"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#005eb8"/><rect x="0" y="96" width="1920" height="6" rx="0" fill="#003087"/><rect x="64" y="26" width="92" height="44" rx="3" fill="#ffffff"/><text x="110" y="58" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" fill="#005eb8" font-weight="700" letter-spacing="1" text-anchor="middle">NHS</text><text x="180" y="46" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="32" fill="#ffffff" font-weight="700">Rare Disease Consult Network</text><text x="180" y="76" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="21" fill="#a8cbe8" font-weight="400">Ask fifty hospitals. Move no records.</text><rect x="0" y="102" width="1920" height="92" rx="0" fill="#ffffff"/><text x="64.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 1  ✓</text><text x="64.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Case described</text><text x="362.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 2  ✓</text><text x="362.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Query fanned out</text><text x="661.3333333333334" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 3  ✓</text><text x="661.3333333333334" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Sites read own notes</text><text x="960.0" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 4  ✓</text><text x="960.0" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Follow-up asked</text><text x="1258.6666666666667" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#768692" font-weight="700" letter-spacing="1.2">STAGE 5  ✓</text><text x="1258.6666666666667" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#4c6272" font-weight="400">Panel attacks</text><text x="1557.3333333333335" y="138" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#005eb8" font-weight="700" letter-spacing="1.2">STAGE 6</text><text x="1557.3333333333335" y="168" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#212b32" font-weight="700">Report returned</text><rect x="0" y="192" width="1920" height="2" rx="0" fill="#d8dde0"/><rect x="0" y="190" width="1537.3333333333335" height="4" rx="0" fill="#007f3b"/><rect x="1537.3333333333335" y="190" width="298.6666666666667" height="4" rx="0" fill="#005eb8"/><text x="64" y="258" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="22" fill="#005eb8" font-weight="700" letter-spacing="1.6">STAGE 6 · WHAT REACHES THE CLINICIAN</text><text x="64" y="328" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="62" fill="#212b32" font-weight="700">A lead to investigate. Not a diagnosis.</text><rect x="64" y="400" width="1792" height="200" rx="4" fill="#f5fbf7" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="400" width="6" height="200" rx="0" fill="#007f3b"/><text x="112" y="470" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="44" fill="#212b32" font-weight="700">Granulomatosis with polyangiitis</text><text x="112" y="522" font-family='"SF Mono", Menlo, monospace' font-size="30" fill="#007f3b" font-weight="700">0.87</text><text x="220" y="522" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#4c6272" font-weight="400">top-3 mean  ·  6 cases across 4 sites  ·  no site held more than 3</text><text x="112" y="570" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="26" fill="#212b32" font-weight="700">Survived refutation with dissent carried.</text><rect x="64" y="636" width="880" height="168" rx="4" fill="#fffcf2" stroke="#d8dde0" stroke-width="1.2"/><rect x="64" y="636" width="6" height="168" rx="0" fill="#8a6100"/><rect x="112" y="670" width="199" height="32" rx="16" fill="#ffffff" stroke="#8a6100" stroke-width="1.2"/><text x="129" y="692" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#8a6100" font-weight="700" letter-spacing="1.1">DISSENT CARRIED</text><text x="112" y="740" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">No site reported ANCA status, so serology is</text><text x="112" y="774" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">assumed rather than shown.</text><rect x="976" y="636" width="880" height="168" rx="4" fill="#ffffff" stroke="#d8dde0" stroke-width="1.2"/><rect x="976" y="636" width="6" height="168" rx="0" fill="#aeb7bd"/><rect x="1024" y="670" width="155" height="32" rx="16" fill="#ffffff" stroke="#4c6272" stroke-width="1.2"/><text x="1041" y="692" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" fill="#4c6272" font-weight="700" letter-spacing="1.1">NOT CLAIMED</text><text x="1024" y="740" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">No clinical validation. A symptom set is still</text><text x="1024" y="774" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="24" fill="#4c6272" font-weight="400">health information. Synthetic records throughout.</text><text x="64" y="900" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="54" fill="#212b32" font-weight="700">It advises. It does not diagnose.</text><text x="64" y="990" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="40" fill="#005eb8" font-weight="700">The note never moves. The judgement does.</text></svg>